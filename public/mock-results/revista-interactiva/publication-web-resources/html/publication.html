<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: linear-gradient(160deg, #0f172a 0%, #134e4a 100%);
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 2rem;
        border-radius: 1.5rem;
        border: 1px solid rgba(34, 211, 238, 0.2);
        background: rgba(17, 24, 39, 0.85);
        box-shadow: 0 0 48px rgba(34, 211, 238, 0.12);
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 0.75rem;
        color: #67e8f9;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Revista interactiva</h1>
      <p>
        Vista interactiva lista para conectar con publicación exportada.
        Sustituye este HTML por el paquete <code>publication-web-resources</code> de InDesign / Digital Publishing.
      </p>
    </div>
  </body>
</html>
